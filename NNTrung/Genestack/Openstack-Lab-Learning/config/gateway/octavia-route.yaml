# Apply only after the Gateway/listener and octavia-api:9876 exist.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: octavia-gateway-route
  namespace: openstack
  labels:
    lab-component: openstack-gateway
spec:
  parentRefs:
    - name: flex-gateway
      namespace: envoy-gateway
      sectionName: openstack-https
  hostnames:
    - octavia.lab.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: octavia-api
          port: 9876
