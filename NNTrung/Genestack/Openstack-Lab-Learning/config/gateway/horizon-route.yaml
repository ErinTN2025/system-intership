apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: horizon-gateway-route
  namespace: openstack
  labels:
    lab-component: openstack-gateway
spec:
  parentRefs:
    - name: flex-gateway
      namespace: envoy-gateway
      sectionName: openstack-https
  hostnames:
    - horizon.lab.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: horizon-int
          port: 80
