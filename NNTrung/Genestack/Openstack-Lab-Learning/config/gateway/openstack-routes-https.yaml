apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keystone-gateway-route
  namespace: openstack
  labels:
    lab-component: openstack-gateway
spec:
  parentRefs:
  - name: flex-gateway
    namespace: envoy-gateway
    sectionName: openstack-http
  - name: flex-gateway
    namespace: envoy-gateway
    sectionName: openstack-https
  hostnames:
  - keystone.lab.test
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: keystone-api
      port: 5000
---
